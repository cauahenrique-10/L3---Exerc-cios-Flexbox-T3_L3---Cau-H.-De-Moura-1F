<!DOCTYPE html>
<html> 
  <head>
    <title>Questão 24 – Faixa de cards</title>
    <link rel="stylesheet" href="questao-24.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <p>Largura da janela: <span id="largura"></span></p>
    <div class="faixa">
      <div class="card">
        <h2>Card 1</h2>
        <p>Texto curto.</p>
      </div>
      <div class="card">
        <h2>Card 2</h2>
        <p>Este card tem um texto um pouco maior para mostrar que a altura é igualada.</p>
      </div>
      <div class="card">
        <h2>Card 3</h2>
        <p>Texto médio, só para variar o tamanho.</p>
      </div>
      <div class="card">
        <h2>Card 4</h2>
        <p>Mais um card com conteúdo de tamanho diferente dos outros, também para testar a altura.</p>
      </div>
    </div>
  </body>
</html>
